<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Calorie Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- BarcodeDetector polyfill (ZXing-C++ WASM) — reliable EAN/UPC scanning on iOS Safari -->
  <script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.0/dist/iife/polyfill.min.js"></script>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <h1 class="login-title">Calorie Tracker</h1>
      <p class="login-subtitle">Track your daily nutrition</p>
      <button id="google-sign-in-btn" class="google-sign-in-btn" onclick="SupabaseAuth.signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <div id="app" class="hidden">

    <!-- ===== Tracker view ===== -->
    <div id="tracker-view" class="tab-view">

    <!-- Date navigation header -->
    <header class="date-header">
      <button id="prev-day-btn" class="nav-btn" aria-label="Previous day">&larr;</button>
      <span id="date-label" class="date-label">Today, Feb 16</span>
      <button id="next-day-btn" class="nav-btn" aria-label="Next day">&rarr;</button>
    </header>

    <!-- Daily summary card -->
    <section class="summary-card">
      <div class="summary-calories-row">
        <div class="summary-cal-block">
          <span class="summary-cal-number" id="summary-calories">0</span>
          <span class="summary-cal-label">eaten</span>
        </div>
        <div class="summary-cal-block">
          <span class="summary-cal-number" id="remaining-calories">0</span>
          <span class="summary-cal-label">remaining</span>
        </div>
        <div class="summary-cal-block">
          <span class="summary-cal-number" id="goal-calories">2000</span>
          <span class="summary-cal-label">goal</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-calories"></div>
      </div>

      <div class="macro-bars">
        <div class="macro-bar-group">
          <div class="macro-bar-label">
            <span class="macro-name">Protein</span>
            <span><span id="summary-protein">0g</span> / <span id="goal-protein">150g</span></span>
          </div>
          <div class="progress-bar-container small">
            <div class="progress-bar protein-bar" id="progress-protein"></div>
          </div>
        </div>
        <div class="macro-bar-group">
          <div class="macro-bar-label">
            <span class="macro-name">Carbs</span>
            <span><span id="summary-carbs">0g</span> / <span id="goal-carbs">250g</span></span>
          </div>
          <div class="progress-bar-container small">
            <div class="progress-bar carbs-bar" id="progress-carbs"></div>
          </div>
        </div>
        <div class="macro-bar-group">
          <div class="macro-bar-label">
            <span class="macro-name">Fat</span>
            <span><span id="summary-fat">0g</span> / <span id="goal-fat">65g</span></span>
          </div>
          <div class="progress-bar-container small">
            <div class="progress-bar fat-bar" id="progress-fat"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Meal sections -->
    <main id="meals-container">
      <!-- Rendered by ui.js -->
    </main>

    </div><!-- /tracker-view -->

    <!-- ===== Profile view ===== -->
    <div id="profile-view" class="tab-view hidden">
      <div class="profile-content">
        <div class="profile-account">
          <span id="user-display-name" class="user-name"></span>
          <span id="user-email" class="user-email"></span>
        </div>
        <div class="profile-field">
          <label class="profile-label" for="profile-calories">Calories</label>
          <input type="number" id="profile-calories" class="profile-input" min="0" step="1" />
        </div>
        <div class="profile-field">
          <label class="profile-label" for="profile-protein">Protein (g)</label>
          <input type="number" id="profile-protein" class="profile-input" min="0" step="1" />
        </div>
        <div class="profile-field">
          <label class="profile-label" for="profile-carbs">Carbs (g)</label>
          <input type="number" id="profile-carbs" class="profile-input" min="0" step="1" />
        </div>
        <div class="profile-field">
          <label class="profile-label" for="profile-fat">Fat (g)</label>
          <input type="number" id="profile-fat" class="profile-input" min="0" step="1" />
        </div>
        <button id="profile-save-btn" class="fd-add-btn">Save goals</button>
        <button id="sign-out-btn" class="sign-out-btn">Sign out</button>
      </div>
    </div><!-- /profile-view -->

    <!-- ===== Bottom nav ===== -->
    <nav class="bottom-nav">
      <button id="tab-tracker" class="nav-tab active">
        <span class="nav-icon">&#127869;</span>
        <span class="nav-label">Tracker</span>
      </button>
      <button id="tab-profile" class="nav-tab">
        <span class="nav-icon">&#128100;</span>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

  </div>

  <!-- Food Detail Screen (full-screen overlay) -->
  <div id="food-detail-screen" class="food-detail-screen hidden">
    <div class="food-detail-header">
      <button id="fd-close-btn" class="fd-close-btn">&times;</button>
      <span id="fd-meal-label" class="fd-meal-label">Breakfast</span>
      <div class="fd-header-spacer"></div>
    </div>
    <div class="food-detail-content">
      <div class="fd-name-section">
        <h2 id="fd-name" class="fd-name"></h2>
        <span id="fd-source" class="fd-source">Generic</span>
      </div>
      <div class="fd-macro-card">
        <div class="fd-macro-col">
          <span id="fd-cal" class="fd-macro-value">0</span>
          <span class="fd-macro-label">Cal</span>
        </div>
        <div class="fd-macro-divider"></div>
        <div class="fd-macro-col">
          <span id="fd-protein" class="fd-macro-value fd-dot-blue">0</span>
          <span class="fd-macro-label">Protein (g)</span>
        </div>
        <div class="fd-macro-divider"></div>
        <div class="fd-macro-col">
          <span id="fd-carbs" class="fd-macro-value fd-dot-orange">0</span>
          <span class="fd-macro-label">Carbs (g)</span>
        </div>
        <div class="fd-macro-divider"></div>
        <div class="fd-macro-col">
          <span id="fd-fat" class="fd-macro-value fd-dot-green">0</span>
          <span class="fd-macro-label">Fat (g)</span>
        </div>
      </div>
      <div class="fd-serving-row">
        <input type="number" id="fd-qty" class="fd-qty" min="0.1" step="0.1" />
        <select id="fd-unit" class="fd-unit"></select>
      </div>
      <button id="fd-add-btn" class="fd-add-btn">Add food</button>
    </div>
  </div>

  <!-- Add Food Bottom Sheet -->
  <div id="add-food-overlay" class="overlay hidden"></div>
  <div id="add-food-panel" class="add-food-panel hidden">
    <div class="panel-header">
      <button id="panel-close-btn" class="panel-close-btn">&times;</button>
      <span id="panel-title" class="panel-title">Add to Breakfast</span>
    </div>
    <div class="panel-search-bar">
      <input type="text" id="food-search-input" class="food-search-input" placeholder="Search foods..." autocomplete="off" />
      <button id="barcode-scan-btn" class="barcode-scan-btn" aria-label="Scan barcode">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          <line x1="7" y1="8" x2="7" y2="16"/>
          <line x1="10" y1="8" x2="10" y2="16"/>
          <line x1="13" y1="8" x2="13" y2="16"/>
          <line x1="17" y1="8" x2="17" y2="16"/>
        </svg>
      </button>
    </div>
    <div id="barcode-viewfinder" class="barcode-viewfinder hidden">
      <div class="viewfinder-header">
        <span>Scan Barcode</span>
        <button id="viewfinder-close-btn" class="viewfinder-close-btn">&times;</button>
      </div>
      <div class="viewfinder-camera">
        <video id="barcode-video" playsinline muted></video>
      </div>
      <div id="barcode-result" class="barcode-result hidden">
        <span id="barcode-number"></span>
        <button id="barcode-confirm-btn" class="barcode-confirm-btn">Confirm</button>
      </div>
    </div>
    <div class="panel-body">
      <button id="manual-add-btn" class="manual-add-btn" type="button">&#43; Enter a food manually</button>

      <!-- Manual food entry form -->
      <div id="manual-food-form" class="manual-food-form hidden">
        <div class="mf-field">
          <label class="mf-label" for="mf-name">Food name</label>
          <input type="text" id="mf-name" class="mf-input" placeholder="e.g. Homemade granola" autocomplete="off" />
        </div>
        <div class="mf-field">
          <label class="mf-label">Nutrition values below are per…</label>
          <div class="mf-per-row">
            <input type="number" id="mf-ref-amount" class="mf-input" min="0" step="any" value="100" inputmode="decimal" aria-label="Reference amount" />
            <input type="text" id="mf-ref-unit" class="mf-input" value="g" placeholder="unit (g, cup, …)" autocomplete="off" aria-label="Unit" />
          </div>
        </div>
        <div class="mf-macros-grid">
          <div class="mf-field">
            <label class="mf-label" for="mf-calories">Calories</label>
            <input type="number" id="mf-calories" class="mf-input" min="0" step="any" inputmode="decimal" />
          </div>
          <div class="mf-field">
            <label class="mf-label" for="mf-protein">Protein (g)</label>
            <input type="number" id="mf-protein" class="mf-input" min="0" step="any" inputmode="decimal" />
          </div>
          <div class="mf-field">
            <label class="mf-label" for="mf-carbs">Carbs (g)</label>
            <input type="number" id="mf-carbs" class="mf-input" min="0" step="any" inputmode="decimal" />
          </div>
          <div class="mf-field">
            <label class="mf-label" for="mf-fat">Fat (g)</label>
            <input type="number" id="mf-fat" class="mf-input" min="0" step="any" inputmode="decimal" />
          </div>
        </div>
        <label class="mf-checkbox">
          <input type="checkbox" id="mf-save" />
          Save to my foods (so I can reuse it later)
        </label>
        <div class="mf-actions">
          <button id="mf-cancel-btn" class="mf-btn mf-btn-secondary" type="button">Cancel</button>
          <button id="mf-continue-btn" class="mf-btn mf-btn-primary" type="button">Continue</button>
        </div>
      </div>

      <div id="all-foods-section">
        <div class="panel-section-heading">All Foods</div>
        <div id="food-list"></div>
      </div>
      <div id="recent-section" class="hidden">
        <div class="panel-section-heading">Recent</div>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>

  <!-- Scripts: order matters (supabase first, then storage, ui, app) -->
  <script src="js/supabase.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
